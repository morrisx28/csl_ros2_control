# Controller Manager configuration
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    # Define the available controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster
    
    swerve_controller:
      type: swerve_controller/SwerveController



imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"


swerve_controller:
  ros__parameters:
    update_rate: 100  
    robot_pkg: "compal_amr_description"
    model_folder: ""
    config_path: /home/csl/test_ws/src/csl_ros2_control/descriptions/compal_amr_description/config/amr.yaml
    
    joints:
      - FL_steering_joint
      - FR_steering_joint
      - RL_steering_joint
      - RR_steering_joint
      - FL_wheel_joint
      - FR_wheel_joint
      - RL_wheel_joint
      - RR_wheel_joint

    command_interfaces:
      - position
      - velocity
      - effort
      - kp
      - kd

    state_interfaces:
      - position
      - velocity
      - effort

    imu_name: "imu_sensor"
    base_name: "base"

    imu_interfaces:
      - orientation.w
      - orientation.x
      - orientation.y
      - orientation.z
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
      - linear_acceleration.x
      - linear_acceleration.y
      - linear_acceleration.z